safety_envelope:
  version: "1.0.0"
  allowed_state:
    speed_min_rpm: 0
    speed_max_rpm: 1800
    current_max_a: 4.0
    temperature_warning_c: 70.0
    temperature_fault_c: 80.0
    max_sensor_age_ms: 3.0
    min_deadline_slack_ms: 0.0
  command_bounds:
    pwm_min: 0.0
    pwm_max: 1.0
    slew_rate_limit_per_cycle: 0.25
  fallback_actions:
    stale_sensor: "safe_stop"
    deadline_miss: "safe_stop"
    thermal_warning: "thermal_derate"
    thermal_fault: "safe_stop"
    current_limit: "clip_or_hold"
    uncertainty_violation: "degraded_control"
