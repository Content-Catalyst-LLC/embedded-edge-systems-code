autonomy_profile:
  device_class: "autonomous_mobile_robot"
  default_autonomy_level: "bounded_local"
  allowed_autonomy_levels:
    - "reactive_automation"
    - "bounded_local"
    - "supervised"
    - "collaborative_fleet"
    - "adaptive"
  allowed_actions:
    - "continue"
    - "slow_down"
    - "reroute"
    - "slow_reroute"
    - "pause_and_request_review"
    - "safe_stop"
  prohibited_actions:
    - "increase_speed_near_hazard"
    - "enter_unknown_zone_without_review"
    - "override_emergency_stop"
  fallback_actions:
    low_confidence: "pause_and_request_review"
    excessive_latency: "safe_stop"
    safety_warning: "slow_down"
    safety_degraded: "safe_stop"
    stale_belief_state: "pause_and_request_review"
