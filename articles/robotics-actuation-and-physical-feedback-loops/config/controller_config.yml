controller:
  name: "pid-position-controller"
  version: "1.0.0"
  sampling_period_s: 0.01
  gains:
    kp: 4.0
    ki: 0.7
    kd: 0.15
  command_limit: 1.0
  anti_windup: true
  derivative_filter_enabled: true
  fallback_mode: "hold_position_then_safe_stop"

tracking:
  max_abs_error: 0.08
  max_settling_time_s: 2.0
  max_saturation_rate: 0.20
