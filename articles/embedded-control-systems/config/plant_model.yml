plant_model:
  name: "dc_motor_speed_demo"
  version: "1.0.0"
  state_variables:
    - speed_rpm
    - load_disturbance
  input_variables:
    - pwm_duty_cycle
  output_variables:
    - measured_speed_rpm
  operating_region:
    min_speed_rpm: 0
    max_speed_rpm: 1800
  dynamics:
    time_constant_s: 0.18
    gain_rpm_per_unit_command: 1600
    nominal_load_disturbance_rpm: 0
  uncertainty:
    process_noise_std_rpm: 6.0
    measurement_noise_std_rpm: 10.0
